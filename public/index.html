<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Melodix — Premium Music Experience</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --bg-card-hover: #1e1e1e;
            --accent-green: #1ed760;
            --text-main: #ffffff;
            --text-secondary: #a7a7a7;
            --border-color: #222222;
            --player-bg: #181818;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: env(safe-area-inset-top) 0 calc(160px + env(safe-area-inset-bottom)) 0;
            -webkit-font-smoothing: antialiased;
        }
        
        header { 
            padding: 14px 20px; 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); text-transform: uppercase; }
        h1 span { color: var(--accent-green); }
        .online-badge { font-size: 11px; font-weight: 600; color: var(--accent-green); background: rgba(30,215,96,0.1); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(30,215,96,0.2); }

        .tabs { 
            display: flex; 
            background: var(--bg-main); 
            padding: 12px 20px; 
            gap: 10px; 
            overflow-x: auto; 
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { 
            background: var(--bg-card); 
            color: var(--text-secondary); 
            border: 1px solid var(--border-color); 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .tab-btn.active { 
            background: var(--text-main); 
            color: var(--bg-main); 
            border-color: var(--text-main);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .view { display: none; padding: 0 20px; animation: fadeIn 0.25s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .search-box { display: flex; gap: 10px; margin-bottom: 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 4px 4px 4px 16px; align-items: center; }
        .search-box svg { width: 20px; height: 20px; fill: var(--text-secondary); }
        input { flex: 1; padding: 10px 0; border: none; background: transparent; color: var(--text-main); font-size: 14px; font-family: inherit; outline: none; }
        input::placeholder { color: var(--text-secondary); }
        .search-btn { padding: 10px 20px; border-radius: 12px; border: none; background: var(--accent-green); color: var(--bg-main); font-weight: 700; font-size: 13px; cursor: pointer; }

        .recent-searches { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; scrollbar-width: none; }
        .recent-searches::-webkit-scrollbar { display: none; }
        .recent-pill { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 12px; font-size: 12px; white-space: nowrap; cursor: pointer; }

        .section-title { font-size: 18px; font-weight: 700; margin: 18px 0 12px 0; letter-spacing: -0.3px; color: var(--text-main); }
        
        .track-item { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            background: var(--bg-card); 
            padding: 10px; 
            border-radius: 14px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            border: 1px solid var(--border-color);
            transition: transform 0.1s, background 0.2s; 
        }
        .track-item:active { transform: scale(0.98); background: var(--bg-card-hover); }
        .track-item img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .track-info { flex: 1; overflow: hidden; }
        .track-info h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info p { margin: 0; font-size: 12px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .horizontal-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .h-card { width: 130px; flex-shrink: 0; cursor: pointer; text-align: center; }
        .h-card img { width: 130px; height: 130px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border-color); margin-bottom: 8px; }
        .h-card p { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .h-card span { font-size: 11px; color: var(--text-secondary); }

        #persistent-player { 
            position: fixed; 
            bottom: calc(16px + env(safe-area-inset-bottom)); 
            left: 16px; 
            right: 16px; 
            background: var(--player-bg); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            padding: 10px 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            z-index: 1000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
        }
        #player-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
        .player-meta { flex: 1; overflow: hidden; cursor: pointer; }
        .player-meta h5 { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta p { margin: 0; font-size: 11px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { display: flex; align-items: center; gap: 14px; }
        .player-controls button { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; display: flex; }
        .player-controls svg { width: 22px; height: 22px; fill: currentColor; }
        .play-pause-btn svg { width: 28px; height: 28px; fill: var(--accent-green); }

        #youtube-player-box { 
            position: fixed; 
            bottom: 90px; 
            left: 16px; 
            width: 120px; 
            height: 70px; 
            z-index: 999; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000;
            opacity: 0.01;
            pointer-events: none;
        }

        #fullscreen-player { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle at top, #1c2b20 0%, var(--bg-main) 75%); 
            z-index: 2000; 
            display: none; 
            flex-direction: column; 
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom)) 24px; 
            justify-content: space-between; 
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .fs-header { display: flex; justify-content: space-between; align-items: center; }
        .fs-header button { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; display: flex; }
        .fs-header svg { width: 24px; height: 24px; fill: currentColor; }
        .fs-queue-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-secondary); text-transform: uppercase; }

        .fs-content { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
        .fs-artwork { width: 100%; max-width: 300px; aspect-ratio: 1; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin: 16px 0; }
        
        .fs-meta-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; }
        .fs-info { text-align: left; overflow: hidden; flex: 1; padding-right: 12px; }
        .fs-info h2 { font-size: 19px; font-weight: 700; margin: 0 0 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fs-info p { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .like-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; }
        .like-btn svg { width: 26px; height: 26px; fill: var(--text-secondary); transition: transform 0.1s; }
        .like-btn.liked svg { fill: var(--accent-green); transform: scale(1.1); }

        .progress-container { width: 100%; margin-bottom: 20px; }
        .progress-slider { 
            width: 100%; 
            -webkit-appearance: none; 
            appearance: none; 
            background: rgba(255,255,255,0.25); 
            height: 6px; 
            border-radius: 3px; 
            outline: none; 
            cursor: pointer; 
            margin-bottom: 8px; 
        }
        .progress-slider::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            background: var(--text-main); 
            cursor: pointer; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .time-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; color: var(--text-secondary); }

        .fs-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 340px; margin: 0 auto; }
        .fs-controls button { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; }
        .fs-controls svg { width: 24px; height: 24px; fill: currentColor; }
        .fs-controls .main-play-btn { width: 64px; height: 64px; background: var(--accent-green); border-radius: 50%; color: var(--bg-main); box-shadow: 0 8px 24px rgba(30, 215, 96, 0.4); }
        .fs-controls .main-play-btn svg { width: 30px; height: 30px; fill: var(--bg-main); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Melodi<span>x</span></h1>
        </div>
        <div class="online-badge">● Online</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">Home</button>
        <button class="tab-btn" onclick="switchTab('search')">Search</button>
        <button class="tab-btn" onclick="switchTab('library')">Library</button>
    </div>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <div class="section-title">Popular Playlists</div>
        <div class="horizontal-scroll" id="playlist-carousel"></div>

        <div class="section-title">Top Artists</div>
        <div class="horizontal-scroll" id="artist-carousel"></div>

        <div class="section-title">Trending Now</div>
        <div id="trending-list"></div>
    </div>

    <!-- SEARCH VIEW -->
    <div id="search-view" class="view">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
            <input type="text" id="searchInput" placeholder="Search songs, artists..." onkeypress="if(event.key==='Enter') searchMusic()">
            <button class="search-btn" onclick="searchMusic()">Search</button>
        </div>
        <div class="recent-searches" id="recentSearchesBar" style="display:none;"></div>
        <div id="search-results"></div>
    </div>

    <!-- LIBRARY VIEW -->
    <div id="library-view" class="view">
        <div class="section-title">Liked Songs</div>
        <div id="library-list">
            <div class="empty-state" style="text-align:center; padding: 40px; color:var(--text-secondary);">
                <h3>No songs saved yet</h3>
                <p>Start listening and build your library.</p>
            </div>
        </div>
    </div>

    <!-- PERSISTENT BOTTOM MINI PLAYER -->
    <div id="persistent-player" style="display: none;">
        <img id="player-thumb" src="" alt="" onclick="openFullscreen()">
        <div class="player-meta" onclick="openFullscreen()">
            <h5 id="player-title">Select a track</h5>
            <p id="player-artist">Melodix Player</p>
        </div>
        <div class="player-controls">
            <button onclick="togglePlay()" class="play-pause-btn" id="playPauseIcon">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="playNext()">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- FULLSCREEN PLAYER MODAL -->
    <div id="fullscreen-player">
        <div class="fs-header">
            <button onclick="closeFullscreen()">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
            <span class="fs-queue-label">Playing from Queue</span>
            <button class="like-btn" id="likeBtn" onclick="toggleLike()">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
        </div>

        <div class="fs-content">
            <img id="fs-artwork" class="fs-artwork" src="" alt="">
            
            <div class="fs-meta-row">
                <div class="fs-info">
                    <h2 id="fs-title">Song Title</h2>
                    <p id="fs-artist">Artist Name</p>
                </div>
            </div>

            <div class="progress-container">
                <input type="range" id="progressSlider" class="progress-slider" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
                <div class="time-row">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
            </div>
        </div>

        <div class="fs-controls">
            <button onclick="toggleShuffle()">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button onclick="playPrev()">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button onclick="togglePlay()" class="main-play-btn" id="fsPlayPause">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="playNext()">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button onclick="toggleRepeat()">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </div>
    </div>

    <div id="youtube-player-box">
        <div id="youtube-player"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        let player;
        let queue = [];
        let currentIndex = 0;
        let isPlaying = false;
        let currentTrack = null;
        let likedSongs = JSON.parse(localStorage.getItem('melodix_likes') || '[]');
        let progressInterval = null;
        let recentSearches = JSON.parse(localStorage.getItem('melodix_recent') || '[]');

        const allSongs = [
            { videoId: 'kJQP7kiw5Fk', title: 'Despacito', channelTitle: 'Luis Fonsi', thumbnail: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300' },
            { videoId: 'JGwWNGJdvx8', title: 'Shape of You', channelTitle: 'Ed Sheeran', thumbnail: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300' },
            { videoId: '09R8_2nJtjg', title: 'Sugar', channelTitle: 'Maroon 5', thumbnail: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300' },
            { videoId: 'fJ9rUzIMcZQ', title: 'Bad Guy', channelTitle: 'Billie Eilish', thumbnail: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300' },
            { videoId: 'OPf0YbXqDm0', title: 'Uptown Funk', channelTitle: 'Mark Ronson ft. Bruno Mars', thumbnail: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300' }
        ];

        const playlists = [
            { title: 'Top Hits 2026', cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300' },
            { title: 'Deep House Mix', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300' },
            { title: 'Party Anthems', cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300' }
        ];

        const artists = [
            { name: 'Ed Sheeran', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300' },
            { name: 'Bruno Mars', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300' },
            { name: 'Maroon 5', img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300' }
        ];

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '70',
                width: '120',
                videoId: '',
                playerVars: { 'playsinline': 1, 'autoplay': 1, 'controls': 1 },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayPauseUI(true);
                startProgressTracker();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayPauseUI(false);
                stopProgressTracker();
            } else if (event.data === YT.PlayerState.ENDED) {
                stopProgressTracker();
                playNext();
            }
        }

        function onPlayerError() { playNext(); }

        function startProgressTracker() {
            stopProgressTracker();
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const currentTime = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const percent = (currentTime / duration) * 100;
                        document.getElementById('progressSlider').value = percent;
                        document.getElementById('currentTime').innerText = formatTime(currentTime);
                        document.getElementById('durationTime').innerText = formatTime(duration);
                    }
                }
            }, 1000);
        }

        function stopProgressTracker() { if (progressInterval) clearInterval(progressInterval); }

        function seekAudio(percent) {
            if (player && player.getDuration) {
                const duration = player.getDuration();
                const seekTime = (percent / 100) * duration;
                player.seekTo(seekTime, true);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`${tabName}-view`).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'home') {
                loadHomeData();
            } else if (tabName === 'search') {
                renderRecentSearches();
            } else if (tabName === 'library') {
                loadLibrary();
            }
        }

        function loadHomeData() {
            document.getElementById('playlist-carousel').innerHTML = playlists.map(p => `
                <div class="h-card" onclick="filterSongs('${p.title}')">
                    <img src="${p.cover}" alt="">
                    <p>${p.title}</p>
                    <span>Playlist</span>
                </div>
            `).join('');

            document.getElementById('artist-carousel').innerHTML = artists.map(a => `
                <div class="h-card" onclick="filterSongs('${a.name}')">
                    <img src="${a.img}" alt="" style="border-radius: 50%;">
                    <p>${a.name}</p>
                    <span>Artist</span>
                </div>
            `).join('');

            queue = allSongs;
            renderList(allSongs, 'trending-list');
        }

        function filterSongs(keyword) {
            const filtered = allSongs.filter(s => s.title.toLowerCase().includes(keyword.toLowerCase()) || s.channelTitle.toLowerCase().includes(keyword.toLowerCase()));
            queue = filtered.length > 0 ? filtered : allSongs;
            renderList(queue, 'trending-list');
        }

        function searchMusic() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!query) return;

            if(!recentSearches.includes(query)) {
                recentSearches.unshift(query);
                if(recentSearches.length > 5) recentSearches.pop();
                localStorage.setItem('melodix_recent', JSON.stringify(recentSearches));
            }
            renderRecentSearches();

            const results = allSongs.filter(s => s.title.toLowerCase().includes(query) || s.channelTitle.toLowerCase().includes(query));
            queue = results;
            renderList(results, 'search-results');
        }

        function renderRecentSearches() {
            const bar = document.getElementById('recentSearchesBar');
            if(recentSearches.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            bar.innerHTML = recentSearches.map(term => `
                <div class="recent-pill" onclick="document.getElementById('searchInput').value='${term}'; searchMusic();">${term}</div>
            `).join('');
        }

        function loadLibrary() {
            const container = document.getElementById('library-list');
            if (likedSongs.length > 0) {
                renderList(likedSongs, 'library-list');
            } else {
                container.innerHTML = `
                    <div class="empty-state" style="text-align:center; padding: 40px; color:var(--text-secondary);">
                        <h3>No songs saved yet</h3>
                        <p>Start listening and build your library.</p>
                    </div>
                `;
            }
        }

        function renderList(tracks, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if(!tracks || tracks.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-secondary);">No tracks found</div>';
                return;
            }
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `
                    <img src="${track.thumbnail}" alt="">
                    <div class="track-info">
                        <h4>${track.title}</h4>
                        <p>${track.channelTitle}</p>
                    </div>
                `;
                div.onclick = () => { queue = tracks; playSongAtIndex(index); };
                container.appendChild(div);
            });
        }

        function playSongAtIndex(index) {
            if(index < 0 || index >= queue.length) return;
            currentIndex = index;
            currentTrack = queue[currentIndex];
            
            if (player && player.loadVideoById) {
                player.loadVideoById(currentTrack.videoId);
            }
            document.getElementById('persistent-player').style.display = 'flex';
            updatePlayerUI();
        }

        function updatePlayerUI() {
            if(!currentTrack) return;
            document.getElementById('player-thumb').src = currentTrack.thumbnail;
            document.getElementById('player-title').innerText = currentTrack.title;
            document.getElementById('player-artist').innerText = currentTrack.channelTitle;

            document.getElementById('fs-artwork').src = currentTrack.thumbnail;
            document.getElementById('fs-title').innerText = currentTrack.title;
            document.getElementById('fs-artist').innerText = currentTrack.channelTitle;

            const isLiked = likedSongs.some(s => s.videoId === currentTrack.videoId);
            const likeBtn = document.getElementById('likeBtn');
            if (isLiked) likeBtn.classList.add('liked');
            else likeBtn.classList.remove('liked');
        }

        function togglePlay() {
            if(!player) return;
            const state = player.getPlayerState();
            if(state === YT.PlayerState.PLAYING) player.pauseVideo();
            else player.playVideo();
        }

        function updatePlayPauseUI(playing) {
            const playSvg = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            const pauseSvg = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            document.getElementById('playPauseIcon').innerHTML = playing ? playSvg : pauseSvg;
            document.getElementById('fsPlayPause').innerHTML = playing ? playSvg : pauseSvg;
        }

        function playNext() {
            if (queue.length === 0) return;
            if (currentIndex < queue.length - 1) playSongAtIndex(currentIndex + 1);
            else playSongAtIndex(0);
        }

        function playPrev() {
            if (queue.length === 0) return;
            if (currentIndex > 0) playSongAtIndex(currentIndex - 1);
            else playSongAtIndex(queue.length - 1);
        }

        function toggleLike() {
            if (!currentTrack) return;
            const index = likedSongs.findIndex(s => s.videoId === currentTrack.videoId);
            if (index > -1) {
                likedSongs.splice(index, 1);
            } else {
                likedSongs.push(currentTrack);
            }
            localStorage.setItem('melodix_likes', JSON.stringify(likedSongs));
            updatePlayerUI();
        }

        function openFullscreen() { if(currentTrack) document.getElementById('fullscreen-player').style.display = 'flex'; }
        function closeFullscreen() { document.getElementById('fullscreen-player').style.display = 'none'; }
        function toggleShuffle() { if (queue.length > 0) { queue.sort(() => Math.random() - 0.5); currentIndex = 0; playSongAtIndex(0); } }
        function toggleRepeat() {}

        window.onload = () => { loadHomeData(); };
    </script>
</body>
</html>
